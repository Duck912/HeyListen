# A HeyListen release made on GitHub's runners, from the tag and nothing else: the Windows setup and builder (signed by
# SignPath when it is set up), the Linux AppImage, their update parts, and a DRAFT release for the tag holding them with
# SHA256SUMS.txt computed after signing. Nothing is published: the maintainer reads the draft and publishes it by hand.
# No game data is involved anywhere: the builder is built from engine/, the tools come from their official releases and
# from earlier HeyListen releases, and every file is checked against make_release.py's FORBIDDEN rules before the draft.
# How it works, what SignPath needs, and a dry run: docs/release.md.
#
#   windows  make_release.py --stage build: the setup and the builder; uploads the files to sign (artifact windows-unsigned)
#   sign     SignPath signs windows-unsigned (.signpath/artifact-configurations/heylisten-builder.xml); skipped, with a
#            notice, while the SIGNPATH_* secret and variables are not set
#   package  make_release.py --stage package, over the signed files: parts, heylisten-setup.txt, notes (windows-release)
#   linux    linux.yml, called: the game-free checks and the AppImage with its parts (publishes nothing when called)
#   release  checks it all again (make_release_linux.sh, collect_release.py), then the parts and the draft release
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*']
    # (a dry run of a branch's code, versioned v0.0.0-dry.<run number>: no draft, test-signing. Works before this file is on
    # the default branch, which workflow_dispatch needs: git push origin <branch>:release-dry-run/<name>)
    branches: ['release-dry-run/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version (v0.4.0). Run from that tag to make its draft release; from a branch for a dry run (v0.4.1-dry.1)'
        type: string
        required: true
      signing:
        description: 'SignPath signing policy (skipped while SignPath is not set up; release-signing only from the tag itself)'
        type: choice
        options: [test-signing, release-signing, none]
        default: test-signing
      draft:
        description: 'Make the draft release (only from the tag itself). Off: a dry run, the files stay workflow artifacts'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version and mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      signing: ${{ steps.meta.outputs.signing }}
    steps:
      # (inputs reach the script through the environment, never pasted into it)
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_SIGNING: ${{ inputs.signing }}
        run: |
          if [ "$EVENT" = push ] && [[ $REF == refs/tags/* ]]; then
            tag=$REF_NAME draft=true signing=release-signing
          elif [ "$EVENT" = push ]; then
            tag=v0.0.0-dry.$GITHUB_RUN_NUMBER draft=false signing=test-signing
          else
            tag=$IN_TAG draft=$IN_DRAFT signing=$IN_SIGNING
          fi
          re='^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$'
          if ! [[ $tag =~ $re ]]; then
            echo "::error::'$tag' is not a release version (v0.4.0, v0.4.1-rc.1)"; exit 1
          fi
          # (a draft release and a release signature only for the code of the tag itself, not a branch's)
          if [ "$REF" != "refs/tags/$tag" ]; then
            if [ "$draft" = true ]; then
              echo "::error::a draft release is made only from the tag: run the workflow from tag $tag (Use workflow from)"; exit 1
            fi
            if [ "$signing" = release-signing ]; then
              echo "::error::release-signing only from the tag: run the workflow from tag $tag, or pick test-signing"; exit 1
            fi
          fi
          { echo "tag=$tag"; echo "draft=$draft"; echo "signing=$signing"; } >> "$GITHUB_OUTPUT"
          echo "::notice::$tag from $REF ($GITHUB_SHA): draft release $draft, signing $signing"

  windows:
    name: Windows setup and builder
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    outputs:
      unsigned-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      # (no cache: what is signed is built from the checkout and the checked downloads alone)
      - name: Setup and builder
        run: python -I tools/release/make_release.py --stage build --tag "$TAG" --out "$RUNNER_TEMP/release"
      - name: The build, for the package job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: ${{ runner.temp }}/release/work-${{ needs.meta.outputs.tag }}/
          if-no-files-found: error
          retention-days: 7
      # (SignPath takes the artifact by its id, from GitHub: it is the origin of what it signs)
      - name: The files to sign
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: ${{ runner.temp }}/release/sign-${{ needs.meta.outputs.tag }}/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Code signing (SignPath)
    needs: [meta, windows]
    runs-on: ubuntu-24.04
    # (release-signing waits for a SignPath approver: SIGNPATH_WAIT_SECONDS, 2 hours unless set)
    timeout-minutes: 240
    permissions:
      actions: read    # (the action's github-token reads this run and downloads windows-unsigned)
      contents: read
    outputs:
      signed: ${{ steps.config.outputs.signed }}
      kind: ${{ steps.config.outputs.kind }}
    steps:
      - name: SignPath settings
        id: config
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG || 'test-signing' }}
          SIGNING: ${{ needs.meta.outputs.signing }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = true ] || missing+=("secret SIGNPATH_API_TOKEN")
          [ -n "$ORGANIZATION" ] || missing+=("variable SIGNPATH_ORGANIZATION_ID")
          [ -n "$PROJECT" ] || missing+=("variable SIGNPATH_PROJECT_SLUG")
          [ -n "$ARTIFACT_CONFIGURATION" ] || missing+=("variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG")
          [ -n "$RELEASE_POLICY" ] || missing+=("variable SIGNPATH_SIGNING_POLICY_SLUG")
          if [ "$SIGNING" = none ]; then
            echo "::notice::signing: none was asked; the Windows files are not signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::SignPath is not set up (no $(IFS=,; echo "${missing[*]}" | sed 's/,/, /g')): the Windows files are not signed. docs/release.md says what to set"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            policy=$RELEASE_POLICY
            [ "$SIGNING" = release-signing ] || policy=$TEST_POLICY
            { echo "signed=true"; echo "kind=$SIGNING"; echo "policy=$policy"; } >> "$GITHUB_OUTPUT"
            echo "SignPath: project $PROJECT, policy $policy, artifact configuration $ARTIFACT_CONFIGURATION"
          fi
      - name: Signing request
        id: signpath
        if: steps.config.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.config.outputs.policy }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.unsigned-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || '7200' }}
          output-artifact-directory: signed
      - name: Signing request link
        if: steps.config.outputs.signed == 'true'
        env:
          URL: ${{ steps.signpath.outputs.signing-request-web-url }}
        run: |
          echo "SignPath signing request: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: The signed files
        if: steps.config.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed
          path: signed/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Windows release files
    needs: [meta, windows, sign]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      SIGNED: ${{ needs.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-build
          path: ${{ runner.temp }}/release/work-${{ needs.meta.outputs.tag }}
      - if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed
          path: ${{ runner.temp }}/signed
      # (each file signed; with release-signing, by a certificate Windows trusts)
      - name: The signatures
        if: needs.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          KIND: ${{ needs.sign.outputs.kind }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'setup/HookshotBuilder-Setup.exe', 'builder/HeyListenBuilder.exe', 'builder/HeyListenBuilder.dll') {
            $s = Get-AuthenticodeSignature -LiteralPath (Join-Path $env:RUNNER_TEMP "signed/$f")
            if (-not $s.SignerCertificate) { throw "${f}: not signed" }
            if ($env:KIND -eq 'release-signing' -and $s.Status -ne 'Valid') { throw "${f}: $($s.Status) $($s.StatusMessage)" }
            "${f}: $($s.Status), $($s.SignerCertificate.Subject)"
          }
      # (the parts hold the builder: they are made from the signed files, so the list's checksums are the signed ones'.
      # make_release.py refuses anything that looks like game data, keys or a cache)
      - name: Parts, list, notes, checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed=()
          if [ "$SIGNED" = true ]; then signed=(--signed "$RUNNER_TEMP/signed"); fi
          python -I tools/release/make_release.py --stage package --tag "$TAG" --out "$RUNNER_TEMP/release" "${signed[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: ${{ runner.temp }}/release/${{ needs.meta.outputs.tag }}/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    needs: meta
    # (GitHub checks every job of a called workflow against this ceiling, linux.yml's release job, which asks for
    # contents: write, included; that job does not run when called, and the jobs that run keep linux.yml's contents: read)
    permissions:
      contents: write
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.meta.outputs.tag }}

  release:
    name: Draft release
    needs: [meta, package, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HeyListen-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HeyListen-linux-parts
          path: dist/linux/parts
      # (the Linux gate: the list's links, each part, the AppImage's content, version, profile and licences)
      - name: Linux files
        run: bash tools/release/make_release_linux.sh "$TAG" dist/linux
      # (both platforms together: FORBIDDEN again, the Windows list against its parts, SHA256SUMS.txt over everything)
      - name: Release files and SHA256SUMS.txt
        run: python3 -I tools/release/collect_release.py "$TAG" dist/windows dist/linux dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

      # (parts named by their checksum: one already there is the same file and is left. Off unless
      # vars.RELEASE_UPLOAD_PARTS is 'true': they are public as soon as uploaded; docs/release.md has the commands)
      - name: New parts to builder-parts and linux-parts
        if: needs.meta.outputs.draft == 'true' && vars.RELEASE_UPLOAD_PARTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view builder-parts --json assets --jq '.assets[].name')
          for f in dist/release/builder-parts/*.zip; do
            [ -f "$f" ] || continue
            if grep -qxF "$(basename "$f")" <<<"$have"; then
              echo "$(basename "$f"): already on builder-parts"
            else
              gh release upload builder-parts "$f"
            fi
          done
          engine/scripts/linux/publish_parts.sh "$PWD/dist/release/linux-parts"
      - name: Draft release
        if: needs.meta.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (an existing release or draft for the tag is never replaced: delete it by hand to make it again)
          if gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | grep -qxF "$TAG"; then
            echo "::error::a release or draft for $TAG exists already: delete it by hand, then run this job again"; exit 1
          fi
          url=$(gh release create "$TAG" --draft --verify-tag --title "HeyListen $TAG" \
            --notes-file dist/release/RELEASE_NOTES.md dist/release/assets/*)
          echo "Draft release: $url (not published: read it, then publish it by hand)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::draft release $TAG made; nothing published"
